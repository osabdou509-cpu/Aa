name: Build Game APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip Project
      run: unzip -o *.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # إنشاء مفتاح التوقيع داخل المجلد الفرعي (حيث توجد ملفات المشروع)
    - name: Generate Debug Keystore
      run: |
        PROJECT_DIR=$(find . -name "build.gradle.kts" -maxdepth 2 -exec dirname {} \; | head -n 1)
        cd "$PROJECT_DIR"
        keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

    # إعطاء صلاحية التنفيذ لملف gradlew أينما كان
    - name: Grant execute permission for gradlew
      run: find . -name "gradlew" -exec chmod +x {} \;

    # تشغيل البناء من داخل المجلد الذي يحتوي على gradlew
    - name: Build with Gradle
      run: find . -name "gradlew" -execdir ./gradlew assembleDebug \;

    # رفع ملف APK الناتج
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: game-debug
        path: '**/*.apk'
